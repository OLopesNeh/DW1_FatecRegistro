<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Inline</title>
  </head>
  <body>
    <h1>Demonstração do Inline</h1>
    <p style="color: blue; font-size: 20px">
      Este é um parágrafo com estilo inline. Usando o atributo style
    </p>
    <p style="color: red; font-weight: bold; background-color: greenyellow">
      Este é outro parágrafo com estilo inline. Usando o atributo style
    </p>

    <!-- Padding: espaçamento interno / margin: espaçamento externo -->
    <div style="border: 2px solid black">
    </div>
    <p style="border: 2px solid gray; padding: 10px; color: purple; margin:50px">
        Este é um parágrafo com estilo inline. Usando o atributo style
    </p>
    <h2 style="color: #FF5733; text-align: center;">
        Titulo com cor hexadecimal
    </h2>
    <div style="background-color:#FF5733; color: white; height: 400px;width: 600px; text-align: center;">
       Desafio Inline
    </div>
  </body>
</html>
